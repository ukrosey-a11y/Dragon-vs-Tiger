    <script>
        let balance = 1000;
        let currentChip = 20;

        function selectChip(amount, element) {
            if (!canBet) return;
            currentChip = amount;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }

        function placeBet(side) {
            if (!canBet) return;
            if (balance < currentChip) {
                document.getElementById('status-message').innerText = "❌ Coins Kam Hain! Game automatic refill ho jayegi.";
                return;
            }
            bets[side] += currentChip;
            balance -= currentChip;
            updateUI();
            document.getElementById('status-message').innerText = `${side} par ${bets[side]} Coins ki Bet ho gayi!`;
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('level').innerText = level;
            document.getElementById('dbet').innerText = "Bet: " + bets.DRAGON;
            document.getElementById('tbet').innerText = "Bet: " + bets.TIGER;
            document.getElementById('tiebet').innerText = "Tie Bet: " + bets.TIE;
        }

        function playRound() {
            if (bets.DRAGON === 0 && bets.TIGER === 0 && bets.TIE === 0) {

    <script>
        let balance = 1000;
        function updateGlobalBalance() { document.getElementById('global-balance').innerText = balance; }

        function switchGame(gameId, btn) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('game-' + gameId).classList.add('active');
            btn.classList.add('active');
            if(gameId === 'car') initCar();
            if(gameId === 'dvt') startDvtTimer();
        }

        // ==================== 🏎️ NEW CAR RACING GAME CODE ====================
        const carCanvas = document.getElementById("carCanvas");
        const carCtx = carCanvas.getContext("2d");
        
        let playerCar, enemyCars, carScore, carGameInterval, carSpeed;
        const carWidth = 35, carHeight = 60;

        function initCar() {
            playerCar = { x: 130, y: 280 };
            enemyCars = [];
            carScore = 0;
            carSpeed = 4;
            document.getElementById("car-score").innerText = carScore;
            if(carGameInterval) clearInterval(carGameInterval);
            carGameInterval = setInterval(updateCarGame, 1000/40); // 40 FPS Smooth
            spawnEnemyCar();
        }

        function spawnEnemyCar() {
            let lanes =; // 3 Lanes
            let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            enemyCars.push({ x: randomLane, y: -70, color: '#e74c3c' });
        }

        function moveCar(dir) {
            if(dir === 'LEFT' && playerCar.x > 30) playerCar.x -= 45;
            if(dir === 'RIGHT' && playerCar.x < 220) playerCar.x += 45;
        }

        // Keyboard support for PC players
        document.addEventListener("keydown", (e) => {
            if(e.key === "ArrowLeft") moveCar('LEFT');
            if(e.key === "ArrowRight") moveCar('RIGHT');
        });

        function updateCarGame() {
            // Draw Road (Grey Background)
            carCtx.fillStyle = "#444";
            carCtx.fillRect(0, 0, carCanvas.width, carCanvas.height);
            
            // Draw Road Side Lines (Yellow border lines)
            carCtx.fillStyle = "#f1c40f";
            carCtx.fillRect(15, 0, 5, carCanvas.height);
            carCtx.fillRect(280, 0, 5, carCanvas.height);

            // Draw White Dashed Lane Dividers
            carCtx.strokeStyle = "#fff";
            carCtx.setLineDash([20, 20]);
            carCtx.lineWidth = 3;
            carCtx.beginPath(); carCtx.moveTo(105, 0); carCtx.lineTo(105, carCanvas.height); carCtx.stroke();
            carCtx.beginPath(); carCtx.moveTo(195, 0); carCtx.lineTo(195, carCanvas.height); carCtx.stroke();

            // Draw Player Car (Blue Box with yellow lights)
            carCtx.fillStyle = "#3498db";
            carCtx.fillRect(playerCar.x, playerCar.y, carWidth, carHeight);

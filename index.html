        h1 { color: #f1c40f; margin: 5px 0; font-size: 26px; text-shadow: 2px 2px #000; }

        .menu-btn:active { transform: translateY(3px); box-shadow: none; }
        .menu-btn.active { background: linear-gradient(135deg, #27ae60, #2ecc71); box-shadow: 0 4px #1e8449; }

        .game-section { display: none; max-width: 400px; margin: 15px auto; background: #222; padding: 15px; border-radius: 12px; border: 2px solid #f1c40f; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .game-section.active { display: block; }

        .dvt-board { background: #0b5345; padding: 15px; border-radius: 10px; border: 3px solid #d4ac0d; margin-top: 10px; }
        #dvt-timer { font-size: 32px; font-weight: bold; color: #fff; background: #e74c3c; width: 60px; height: 60px; line-height: 60px; border-radius: 50%; margin: 10px auto; box-shadow: 0 0 10px #e74c3c; }
        .dvt-zones { display: flex; justify-content: space-around; margin: 15px 0; }
        .dvt-card-box { width: 110px; background: rgba(0,0,0,0.5); padding: 10px 5px; border-radius: 8px; border: 2px dashed #fff; }
        .dvt-card { width: 70px; height: 100px; background: white; color: black; border-radius: 6px; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .chip-box { margin: 10px 0; }
        .dvt-chip { display: inline-block; width: 40px; height: 40px; background: #e67e22; border-radius: 50%; line-height: 40px; font-weight: bold; color: #000; margin: 0 5px; cursor: pointer; border: 2px dashed #fff; }
        .dvt-chip.active { background: #fff; border-color: #e67e22; transform: scale(1.1); }
        .dvt-bet-btn { padding: 10px; font-size: 14px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; margin: 0 3px; width: 95px; }
        
        canvas { background-color: #27ae60; border: 3px solid #f1c40f; border-radius: 8px; max-width: 100%; display: block; margin: 0 auto; }
        .controls { display: grid; grid-template-columns: repeat(3, 55px); grid-gap: 8px; margin-top: 10px; justify-content: center; }
        .btn { width: 55px; height: 55px; background-color: #e67e22; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
        
        .ad-container { margin: 10px auto; width: 320px; min-height: 50px; display: flex; justify-content: center; align-items: center; background: #000; }
    </style>
